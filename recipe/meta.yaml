{% set name = "pymt_gridmet" %}
{% set version = "0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/pymt-lab/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 8ebbf29c00afba9d7ca58e174bdcc77284b865403a36f7e094615e4bae397941

build:
  noarch: python
  number: 1
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - gridmet_bmi

test:
  requires:
    # - bmi-tester
    - python {{ python_min }}
  imports:
    - pymt_gridmet
  # commands:
  #   - bmi-test pymt_gridmet.bmi:GridMet --config-file=${PWD}/examples/gridmet.yaml --root-dir=examples -vvv  # [unix]

about:
  home: https://github.com/pymt-lab/pymt_gridmet
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python package that exposes *gridmet_bmi* as a *pymt* component
  doc_url: https://pymt.readthedocs.io
  dev_url: https://github.com/pymt-lab/pymt_gridmet

extra:
  recipe-maintainers:
    - mdpiper
